# Virtual workspace root. No package here — every crate lives under crates/.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/napbat/groupnet"

[workspace.dependencies]
groupnet-core = { path = "crates/groupnet-core", version = "0.1.0" }
groupnet-transport = { path = "crates/groupnet-transport", version = "0.1.0" }
groupnet-transport-mem = { path = "crates/groupnet-transport-mem", version = "0.1.0" }
groupnet-transport-udp = { path = "crates/groupnet-transport-udp", version = "0.1.0" }
# default-features = false so the umbrella's `tcp` / `tcp-msg` features pick
# exactly one plane; direct dependents get both planes by default anyway.
groupnet-transport-tcp = { path = "crates/groupnet-transport-tcp", version = "0.1.0", default-features = false }
groupnet-runtime = { path = "crates/groupnet-runtime", version = "0.1.0" }
groupnet-consistency = { path = "crates/groupnet-consistency", version = "0.1.0" }
groupnet-sim = { path = "crates/groupnet-sim", version = "0.1.0" }

# Keep feature activation at each dependency site. The workspace entries
# centralize versions without enabling runtime or data-plane features.
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7", default-features = false }
bytes = "1"
futures-util = { version = "0.3", default-features = false }
futures = { version = "0.3", default-features = false }
zerocopy = "0.8"
divan = "0.1.21"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"
