# Virtual workspace root. No package here — every crate lives under crates/.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/napbat/groupnet"

[workspace.dependencies]
groupnet-core = { path = "crates/groupnet-core", version = "0.1.0" }
groupnet-transport = { path = "crates/groupnet-transport", version = "0.1.0" }
groupnet-transport-mem = { path = "crates/groupnet-transport-mem", version = "0.1.0" }
groupnet-transport-udp = { path = "crates/groupnet-transport-udp", version = "0.1.0" }
# default-features = false so the umbrella's `tcp` / `tcp-msg` features pick
# exactly one plane; direct dependents get both planes by default anyway.
groupnet-transport-tcp = { path = "crates/groupnet-transport-tcp", version = "0.1.0", default-features = false }
groupnet-transport-router = { path = "crates/groupnet-transport-router", version = "0.1.0" }
groupnet-transport-ipc = { path = "crates/groupnet-transport-ipc", version = "0.1.0" }
groupnet-transport-punch = { path = "crates/groupnet-transport-punch", version = "0.1.0" }
groupnet-runtime = { path = "crates/groupnet-runtime", version = "0.1.0" }
groupnet-rpc = { path = "crates/groupnet-rpc", version = "0.1.0" }
groupnet-consistency = { path = "crates/groupnet-consistency", version = "0.1.0" }
groupnet-sim = { path = "crates/groupnet-sim", version = "0.1.0" }

# Keep feature activation at each dependency site. The workspace entries
# centralize versions without enabling runtime or data-plane features.
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7", default-features = false }
bytes = "1"
futures-util = { version = "0.3", default-features = false }
futures = { version = "0.3", default-features = false }
zerocopy = "0.8"
divan = "0.1.21"
# Audited cryptographic primitives and TLS only; routing, discovery, reliability,
# UDP hole-punching, IPC, and relay logic are implemented in this workspace.
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
] }
# Test-only, locally generated certificate fixtures for authentication regressions.
rcgen = { version = "0.14", default-features = false, features = [
    "crypto",
    "ring",
] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"
warnings = { level = "deny", priority = -2 }
unused = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -2 }
allow_attributes = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[workspace.lints.rustdoc]
all = { level = "warn", priority = -1 }
broken_intra_doc_links = { level = "warn", priority = -1 }
private_intra_doc_links = { level = "warn", priority = -1 }
