[package]
name = "groupnet-network"
description = "Protocol-independent group-network routing and end-to-end encrypted streams."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Internal fault/count fixtures inspect router frames through the real codec.
test-support = []

[dependencies]
groupnet-core.workspace = true
groupnet-transport = { workspace = true, features = ["bulk", "link"] }
tokio = { workspace = true, features = ["net", "io-util", "rt", "sync", "time", "macros"] }
tokio-util = { workspace = true, features = ["compat", "rt"] }
futures-util = { workspace = true, features = ["io", "sink", "async-await"] }
ring.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
groupnet-transport-mem.workspace = true
groupnet-transport-tcp = { workspace = true, features = ["msg", "link"] }
groupnet-transport-ipc.workspace = true
groupnet-transport-punch.workspace = true
rcgen.workspace = true
groupnet-testkit = { path = "../groupnet-testkit", features = ["cluster"] }

[lints]
workspace = true
