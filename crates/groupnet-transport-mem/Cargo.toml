[package]
name = "groupnet-transport-mem"
description = "In-process (in-memory) Transport binding for Groupnet — for tests, examples, and single-process clusters."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Data plane: `MemBulkNet` / `MemBulkTransport`, reliable in-process byte
# streams over `tokio::io::duplex`. Pulls the `bulk` trait surface, tokio's
# pipe (`io-util`), and the futures-io compat shim — all inert by default, so
# the control-plane-only build stays on tokio's `sync` slice alone.
bulk = ["groupnet-transport/bulk", "tokio/io-util", "dep:tokio-util"]
# Opt-in managed link registration and executor-driven link workers.
link = ["groupnet-transport/link"]

# A concrete Transport binding depends only on the trait and the id type — never
# on the runtime. It pulls just tokio's channel/sync slice.
[dependencies]
bytes = { workspace = true }
groupnet-core = { workspace = true }
groupnet-transport = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
# Data plane only — inert unless the `bulk` feature is enabled.
tokio-util = { workspace = true, features = ["compat"], optional = true }

# The integration tests drive the endpoints from an executor, so they need the
# wider test-only tokio slice (rt + macros + time) on top of `sync`.
[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }

[lints]
workspace = true
