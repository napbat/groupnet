[package]
name = "groupnet-transport-mem"
description = "In-process (in-memory) Transport binding for Groupnet — for tests, examples, and single-process clusters."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# A concrete Transport binding depends only on the trait and the id type — never
# on the runtime. It pulls just tokio's channel/sync slice.
[dependencies]
groupnet-core = { workspace = true }
groupnet-transport = { workspace = true }
tokio = { version = "1", default-features = false, features = ["sync"] }

# The integration test drives the endpoints from an executor, so it needs the
# workspace's wider tokio slice (rt + macros + time) on top of `sync`.
[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
