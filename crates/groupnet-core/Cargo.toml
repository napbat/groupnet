[package]
name = "groupnet-core"
description = "Sans-IO deterministic coordination state machine for Groupnet. No I/O, no clock, no async, no dependencies."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Intentionally empty. The core is a pure state machine; it must stay dep-free
# so it can be simulated, fuzzed, and (later) compiled no_std.
[dependencies]

[dev-dependencies]
# Path-only and publish = false: cargo strips path-only dev-deps at publish,
# so this never enters the published dependency graph. Do NOT add `version`.
# Default features only — never `cluster` — so the test graph stays tokio-free.
groupnet-testkit = { path = "../groupnet-testkit" }
# Benchmark harness. Dev-only, so the published dependency graph stays empty —
# the core's `[dependencies]` is intentionally bare and must remain so.
divan = "0.1.21"

# `harness = false` hands the target to divan's own `#[divan::bench]` runner
# instead of libtest.
[[bench]]
name = "wire"
harness = false

[[bench]]
name = "placement"
harness = false

[lints]
workspace = true
