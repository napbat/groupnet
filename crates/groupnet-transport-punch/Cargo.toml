[package]
name = "groupnet-transport-punch"
description = "Native UDP and TCP direct connectivity, candidate traversal, rendezvous, and relay fallback."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
groupnet-core.workspace = true
groupnet-transport = { workspace = true, features = ["link"] }
bytes.workspace = true
zerocopy.workspace = true
ring.workspace = true
socket2.workspace = true
if-addrs.workspace = true
tokio = { workspace = true, features = ["net", "rt", "sync", "time", "macros", "io-util"] }
tokio-util = { workspace = true, features = ["rt"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
groupnet-testkit = { path = "../groupnet-testkit", features = ["cluster"] }

[lints]
workspace = true
