[package]
name = "groupnet-transport-router"
description = "Multi-transport routing, native discovery and encrypted tunnels for Groupnet."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
groupnet-core.workspace = true
groupnet-transport = { workspace = true, features = ["bulk"] }
groupnet-transport-udp.workspace = true
groupnet-transport-tcp = { workspace = true, features = ["msg"] }
tokio = { workspace = true, features = ["net", "io-util", "rt", "sync", "time", "macros"] }
tokio-util = { workspace = true, features = ["compat", "rt"] }
futures-util = { workspace = true, features = ["io"] }
ring.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
groupnet-transport-mem.workspace = true
rcgen.workspace = true
groupnet-testkit = { path = "../groupnet-testkit", features = ["cluster"] }

[lints]
workspace = true
