[package]
name = "groupnet-transport-tcp"
description = "TCP data-plane binding for Groupnet — reliable byte streams over real sockets, implementing BulkTransport."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# A BulkTransport binding: depends on the data-plane trait crate plus tokio's
# TCP + the futures-io compat shim. Never on the runtime.
[dependencies]
groupnet-core = { workspace = true }
groupnet-transport = { workspace = true, features = ["bulk"] }
tokio = { version = "1", default-features = false, features = ["net", "io-util"] }
tokio-util = { version = "0.7", default-features = false, features = ["compat"] }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros"] }
bytes = "1"

[lints]
workspace = true
