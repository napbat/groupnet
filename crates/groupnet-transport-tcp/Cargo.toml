[package]
name = "groupnet-transport-tcp"
description = "TCP bindings for Groupnet — a persistent-connection control-plane Transport and the reliable data-plane BulkTransport."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["msg", "bulk"]
# Control plane: `TcpMsgTransport`, best-effort messages over a bounded pool
# of persistent connections. Needs tokio's task/sync/time slices for the
# accept loop and per-connection workers, and the shared stream framing.
msg = ["groupnet-transport/framing", "tokio/rt", "tokio/sync", "tokio/time", "tokio/macros"]
# Data plane: `TcpBulkTransport`, reliable byte streams. Pulls the `bulk`
# trait surface plus the futures-io compat shim, and tokio's task/sync/time
# slices for the listener task and deadline-bounded handshakes.
bulk = ["groupnet-transport/bulk", "dep:tokio-util", "tokio/rt", "tokio/sync", "tokio/time"]
# Router registration also needs the control-plane binding.
link = ["msg", "groupnet-transport/link"]
# Native rendezvous, candidate traversal, and relay fallback on the existing link.
connectivity = ["dep:groupnet-transport-punch", "link"]

# Never depends on the runtime — bindings stay below it.
[dependencies]
groupnet-core = { workspace = true }
groupnet-transport = { workspace = true }
groupnet-transport-punch = { workspace = true, optional = true }
bytes = { workspace = true }
zerocopy = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["net", "io-util"] }
tokio-util = { workspace = true, features = ["compat"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
groupnet-testkit = { path = "../groupnet-testkit", features = ["cluster"] }

[lints]
workspace = true
