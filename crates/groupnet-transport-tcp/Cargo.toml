[package]
name = "groupnet-transport-tcp"
description = "TCP bindings for Groupnet — a persistent-connection control-plane Transport and the reliable data-plane BulkTransport."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["msg", "bulk"]
# Control plane: `TcpMsgTransport`, best-effort messages over a bounded pool
# of persistent connections. Needs tokio's task/sync/time slices for the
# accept loop and per-connection workers, and the shared stream framing.
msg = ["groupnet-transport/framing", "tokio/rt", "tokio/sync", "tokio/time", "tokio/macros"]
# Data plane: `TcpBulkTransport`, reliable byte streams. Pulls the `bulk`
# trait surface plus the futures-io compat shim, tokio's task/sync/time
# slices for the listener task and deadline-bounded handshakes, and the
# shared `ClusterSecret` its handshake authenticates with.
bulk = ["groupnet-transport/bulk", "groupnet-transport/auth", "dep:tokio-util", "tokio/rt", "tokio/sync", "tokio/time"]
# Data plane over mutually authenticated TLS 1.3: `TcpBulkTransport<TcpTls>`,
# where a hub with a long-lived key admits clients it was never configured
# with through an `Admission` policy, and each client dials with a fresh key
# per connection and pins every hub's key (RFC 7250 raw public keys). Pulls
# rustls and tokio-rustls on ring (already the workspace's TLS stack), ring
# itself for key generation, and the shared admission contract.
tls = ["bulk", "groupnet-transport/link", "dep:rustls", "dep:tokio-rustls", "dep:ring"]
# Router registration also needs the control-plane binding.
link = ["msg", "groupnet-transport/link"]
# Native rendezvous, candidate traversal, and relay fallback on the existing link.
connectivity = ["dep:groupnet-transport-punch", "link"]

# Never depends on the runtime — bindings stay below it.
[dependencies]
groupnet-core = { workspace = true }
groupnet-transport = { workspace = true }
groupnet-transport-punch = { workspace = true, optional = true }
bytes = { workspace = true }
zerocopy = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["net", "io-util"] }
tokio-util = { workspace = true, features = ["compat"], optional = true }
ring = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
groupnet-testkit = { path = "../groupnet-testkit", features = ["cluster"] }
# The TLS data-plane suite runs RPC calls and a subscription over it.
groupnet-rpc.workspace = true

[lints]
workspace = true

# Render every optional API with per-item feature badges.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
