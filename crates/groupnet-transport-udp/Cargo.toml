[package]
name = "groupnet-transport-udp"
description = "UDP Transport binding for Groupnet — best-effort datagrams over real sockets."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Opt-in router registration; the default socket binding stays minimal.
link = ["groupnet-transport/link"]
# Native admission, direct traversal and maintained relay fallback.
connectivity = ["dep:groupnet-transport-punch", "link"]

# The direct socket binding depends only on the trait, ids and networking.
[dependencies]
groupnet-core = { workspace = true }
groupnet-transport = { workspace = true }
groupnet-transport-punch = { workspace = true, optional = true }
tokio = { workspace = true, features = ["net"] }

# Test-only: the unit tests exchange real datagrams over loopback, which needs
# an async runtime + the `#[tokio::test]` macro. This dev dependency enables
# `rt`/`macros`/`time`; it unifies with the `net` slice above for the test build
# (no new crate — tokio is already a dependency).
[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
groupnet-network = { workspace = true }
groupnet-testkit = { path = "../groupnet-testkit", features = ["cluster"] }

[lints]
workspace = true
