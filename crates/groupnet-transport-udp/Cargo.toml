[package]
name = "groupnet-transport-udp"
description = "UDP Transport binding for Groupnet — best-effort datagrams over real sockets."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Depends only on the trait + id type, plus tokio's networking slice. The
# runtime never needs to know this crate exists.
[dependencies]
groupnet-core = { workspace = true }
groupnet-transport = { workspace = true }
tokio = { version = "1", default-features = false, features = ["net"] }

# Test-only: the unit tests exchange real datagrams over loopback, which needs
# an async runtime + the `#[tokio::test]` macro. The workspace tokio carries
# `rt`/`macros`/`time`; it unifies with the `net` slice above for the test build
# (no new crate — tokio is already a dependency).
[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
