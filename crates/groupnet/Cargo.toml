[package]
name = "groupnet"
description = "A deterministic, leaderless coordination fabric for sharded distributed systems — the umbrella crate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# `runtime` (the async Node/Group API + tokio) and `mem` (the in-memory
# transport) are on by default so the basic example works out of the box. `udp`
# (real sockets) and `sim` (the deterministic simulator) are opt-in. Depend with
# `default-features = false` for just the sans-IO core + transport trait.
default = ["runtime", "mem"]
runtime = ["dep:groupnet-runtime"]
mem = ["dep:groupnet-transport-mem"]
udp = ["dep:groupnet-transport-udp"]
# Data plane: `bulk` is the stream trait + framing (in groupnet-transport);
# `tcp` is the TCP binding.
bulk = ["groupnet-transport/bulk"]
tcp = ["bulk", "dep:groupnet-transport-tcp", "groupnet-transport-tcp/bulk"]
# Control plane over persistent TCP: a bounded pool of lazily dialed,
# idle-closed connections — the constant-connection *option* for deployments
# that want frames delivered at network latency over reliable links. Gossip
# deployments keep `udp`; nothing forces a socket per member.
tcp-msg = ["dep:groupnet-transport-tcp", "groupnet-transport-tcp/msg"]
# Session-consistency layer: per-writer sequenced write feeds with loss
# detection, and applied-write frontiers for read-your-writes barriers.
# Built on the runtime's Group handle.
consistency = ["runtime", "dep:groupnet-consistency"]
sim = ["dep:groupnet-sim"]

[dependencies]
groupnet-core = { workspace = true }
groupnet-transport = { workspace = true }
groupnet-transport-mem = { workspace = true, optional = true }
groupnet-transport-udp = { workspace = true, optional = true }
groupnet-transport-tcp = { workspace = true, optional = true }
groupnet-runtime = { workspace = true, optional = true }
groupnet-consistency = { workspace = true, optional = true }
groupnet-sim = { workspace = true, optional = true }

# The async examples drive the runtime, so they need a Tokio executor.
[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true

# The doc table and its links cover every layer, so render docs.rs with all
# features on — otherwise the feature-gated modules (sim, tcp, …) go missing.
[package.metadata.docs.rs]
all-features = true
