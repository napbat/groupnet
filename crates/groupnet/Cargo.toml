[package]
name = "groupnet"
description = "A deterministic, leaderless coordination fabric for sharded distributed systems — the umbrella crate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Every runtime node owns a routed network. Protocol bindings remain selectable;
# memory supports the default examples without opening OS sockets.
# Disable defaults for the dependency-free coordination core and transport trait.
default = ["runtime", "mem"]
runtime = [
    "dep:groupnet-runtime", "bulk", "dep:groupnet-network", "dep:groupnet-messaging", "dep:groupnet-streams",
    "groupnet-transport/link", "groupnet-transport-mem?/link",
    "groupnet-transport-tcp?/link", "groupnet-transport-udp?/link",
]
mem = ["dep:groupnet-transport-mem"]
udp = ["dep:groupnet-transport-udp"]
# Named seeds resolved through the operating system's resolver
# (`runtime::SystemResolver`): a seed addressed as `host:port` and re-resolved
# for the life of the node.
dns = ["runtime", "groupnet-runtime/dns"]
# Data plane: `bulk` is the stream trait + framing (in groupnet-transport);
# `tcp` is the TCP binding.
bulk = ["groupnet-transport/bulk"]
tcp = ["bulk", "dep:groupnet-transport-tcp", "groupnet-transport-tcp/bulk"]
# Control plane over persistent TCP: a bounded pool of lazily dialed,
# idle-closed connections — the constant-connection *option* for deployments
# that want frames delivered at network latency over reliable links. Gossip
# deployments keep `udp`; nothing forces a socket per member.
tcp-msg = ["dep:groupnet-transport-tcp", "groupnet-transport-tcp/msg"]
# Native link implementations are independent crates, not router built-ins.
ipc = ["dep:groupnet-transport-ipc"]
# Native adjacent-path establishment used internally by enabled TCP/UDP bindings.
connectivity = [
    "dep:groupnet-transport-punch",
    "groupnet-transport-tcp?/connectivity",
    "groupnet-transport-udp?/connectivity",
]
# Request/response RPC over the data plane: concurrent calls multiplexed onto
# one stream per peer, with deadlines, bounded frames and per-connection
# handler limits. Rides `bulk`, so bring a binding (`tcp`, or your own). The
# weak `groupnet-transport-mem?/bulk` is the same edge `consistency-handoff`
# carries: if `mem` is on, its `MemBulkNet` comes too, and nothing otherwise.
rpc = ["bulk", "dep:groupnet-rpc", "groupnet-transport-mem?/bulk"]
# Session-consistency layer: per-writer sequenced write feeds with loss
# detection, and applied-write frontiers for read-your-writes barriers.
# Built on the runtime's Group handle.
consistency = ["runtime", "dep:groupnet-consistency"]
# The strong-coherence tier on top: applied-watermark acks (AckLedger /
# applied_cluster_wide). Opt-in — writers wait on every alive member, and
# one ledger republish flows per applied event; see the scaling envelope.
consistency-acks = ["consistency", "groupnet-consistency/acks"]
# The coherence-lease tier above that: readers hold self-expiring leases to
# *serve*, so a writer's invalidation ends at an acknowledgement or at a silent
# peer's lease lapse — bounded by the stale node's own clock instead of by a
# timeout. Its fast path *is* an ack round, so it implies `consistency-acks`.
consistency-leases = ["consistency-acks", "groupnet-consistency/leases"]
# The Hosted write path: fenced, epoch-scoped writes through the group's elected
# host, with a commit level pricing the guarantee (Local / QuorumApplied /
# AllApplied). Layers straight onto `consistency` and deliberately *not* onto
# `consistency-acks` — its commit ledger is a new, epoch-stamped entry rather
# than a scoped reuse of the ack tier's watermarks.
consistency-hosted = ["consistency", "groupnet-consistency/hosted"]
# Snapshot handoff on top of the Hosted write path: a recovering host pulls a
# covering snapshot from a donor over the data plane instead of waiting for a
# ring it has already overrun. The only consistency feature that reaches across
# the two planes, so it turns `bulk` on — bring your own binding (`tcp`, or the
# `BulkTransport` trait over your own).
#
# `groupnet-transport-mem?/bulk` is the one non-obvious edge, and the `?` is the
# whole of it: this feature needs no in-memory transport, but *if* `mem` is also
# on (it is, by default) then the binding it selects must carry its data plane
# too. Without it `transport::mem` would expose the control plane alone and the
# tier's own in-process fabric — `MemBulkNet` — would be missing from the one
# build that most obviously wants it. Weak, so `--no-default-features` plus this
# tier still pulls in nothing.
consistency-handoff = [
    "consistency-hosted",
    "bulk",
    "groupnet-consistency/handoff",
    "groupnet-transport-mem?/bulk",
]
# Resumable source-backed replay and native-position read floors. Snapshot and
# event-complete subscriptions are separate later capabilities.
consistency-replication = ["consistency", "groupnet-consistency/replication"]
consistency-volatile-recovery = ["consistency", "groupnet-consistency/volatile-recovery"]
consistency-volatile-bootstrap-bulk = [
    "consistency-volatile-recovery",
    "bulk",
    "groupnet-consistency/volatile-bootstrap-bulk",
    "groupnet-transport-mem?/bulk",
]
sim = ["dep:groupnet-sim"]

[dependencies]
groupnet-core = { workspace = true }
groupnet-transport = { workspace = true }
groupnet-transport-mem = { workspace = true, optional = true }
groupnet-transport-udp = { workspace = true, optional = true }
groupnet-transport-tcp = { workspace = true, optional = true }
groupnet-network = { workspace = true, optional = true }
groupnet-messaging = { workspace = true, optional = true }
groupnet-streams = { workspace = true, optional = true }
groupnet-transport-ipc = { workspace = true, optional = true }
groupnet-transport-punch = { workspace = true, optional = true }
groupnet-runtime = { workspace = true, optional = true }
groupnet-rpc = { workspace = true, optional = true }
groupnet-consistency = { workspace = true, optional = true }
groupnet-sim = { workspace = true, optional = true }

# The async examples drive the runtime, so they need a Tokio executor.
[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
# The handoff facade test implements `SnapshotSource`/`SnapshotSink`, whose chunk
# type is `bytes::Bytes`. The facade re-exports no `bytes`, so a consumer that
# implements those two traits declares its own bytes dependency. This test uses
# the workspace version. Dev-only: nothing enters the published graph.
bytes = { workspace = true }
rcgen = { workspace = true }
futures-util = { workspace = true, features = ["io"] }
# Path-only and publish = false: cargo strips path-only dev-deps at publish,
# so this never enters the published dependency graph. Do NOT add `version`.
groupnet-testkit = { path = "../groupnet-testkit", features = ["cluster"] }

# `placement` is sans-IO and builds from the core alone; the async examples
# drive the runtime over the in-memory transport, so they are gated off under
# `--no-default-features` builds.
[[example]]
name = "cluster"
required-features = ["runtime", "mem"]

[[example]]
name = "routing"
required-features = ["runtime", "mem"]

[[example]]
name = "dynamic-admission"
required-features = ["runtime", "tcp-msg"]

[[example]]
name = "dynamic-relay"
required-features = ["runtime", "udp", "connectivity"]

[[example]]
name = "native-traversal"
required-features = ["runtime", "udp", "tcp-msg", "connectivity"]

[[example]]
name = "connectivity-bridge"
required-features = ["runtime", "mem", "tcp-msg", "connectivity"]

[[example]]
name = "application-messages"
required-features = ["runtime", "mem", "tcp-msg", "connectivity"]

[[example]]
name = "packet-path"
path = "examples/packet-path/main.rs"
required-features = ["runtime", "mem", "udp", "tcp-msg", "connectivity"]

[lints]
workspace = true

# The doc table and its links cover every layer, so render docs.rs with all
# features on — otherwise the feature-gated modules (sim, tcp, …) go missing.
[package.metadata.docs.rs]
all-features = true
