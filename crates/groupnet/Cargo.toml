[package]
name = "groupnet"
description = "A deterministic, leaderless coordination fabric for sharded distributed systems — the umbrella crate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Features come in two kinds, joined by weak `?/` edges so that every selected
# binding carries each selected capability it supports (bulk: mem, tcp;
# connectivity: tcp, udp; runtime: every binding):
#
# * bindings choose transport crates: `mem`, `tcp`, `udp`, `ipc`;
# * capabilities choose planes: `runtime` (managed nodes: routing, messages,
#   ordered/unordered sessions, link registration), `bulk` (data-plane streams)
#   and `connectivity` (native traversal under TCP/UDP links).
#
# The defaults run a managed node over memory links without opening OS sockets.
# Disable them for the dependency-free core and the runtime-free transport
# traits.
default = ["runtime", "mem"]
runtime = [
    "dep:groupnet-runtime", "dep:groupnet-network", "dep:groupnet-messaging", "dep:groupnet-streams",
    "bulk", "groupnet-transport/link",
    "groupnet-transport-mem?/link", "groupnet-transport-tcp?/link", "groupnet-transport-udp?/link",
]
bulk = ["groupnet-transport/bulk", "groupnet-transport-mem?/bulk", "groupnet-transport-tcp?/bulk"]
connectivity = [
    "dep:groupnet-transport-punch",
    "groupnet-transport-tcp?/connectivity",
    "groupnet-transport-udp?/connectivity",
]
# Named seeds resolved through the operating system's resolver
# (`runtime::SystemResolver`): a seed addressed as `host:port` and re-resolved
# for the life of the node.
dns = ["runtime", "groupnet-runtime/dns"]
mem = ["dep:groupnet-transport-mem"]
# Persistent-connection control plane (`TcpMsgTransport`); with `bulk`, also
# reliable streams (`TcpBulkTransport`); with `runtime`, the managed `TcpLink`.
tcp = ["dep:groupnet-transport-tcp", "groupnet-transport-tcp/msg"]
udp = ["dep:groupnet-transport-udp"]
ipc = ["dep:groupnet-transport-ipc"]
# Request/response RPC over the data plane: concurrent calls multiplexed onto
# one stream per peer, with deadlines, bounded frames and per-connection
# handler limits. Rides `bulk`, so bring a binding (`tcp`, `mem`, a runtime
# `Node`, or your own).
rpc = ["bulk", "dep:groupnet-rpc"]
# Session-consistency layer: per-writer sequenced write feeds with loss
# detection, and applied-write frontiers for read-your-writes barriers.
# Built on the runtime's Group handle.
consistency = ["runtime", "dep:groupnet-consistency"]
# Applied-watermark acknowledgements (`AckLedger`, `applied_by_selected`,
# `applied_by_roster`) reporting an `AckOutcome`: who was waited on, who
# acknowledged, who is missing. One ledger republish flows per applied event.
consistency-acks = ["consistency", "groupnet-consistency/acks"]
# The coherence-lease tier above that: readers hold self-expiring leases to
# *serve*, so a writer's invalidation ends at an acknowledgement or at a silent
# peer's lease lapse — bounded by the stale node's own clock instead of by a
# timeout. Its fast path *is* an ack round, so it implies `consistency-acks`.
consistency-leases = ["consistency-acks", "groupnet-consistency/leases"]
# The Hosted write path: fenced, epoch-scoped writes through the group's elected
# host, with a commit level pricing the guarantee (Local / QuorumApplied /
# AllApplied). Layers straight onto `consistency` and deliberately *not* onto
# `consistency-acks` — its commit ledger is a new, epoch-stamped entry rather
# than a scoped reuse of the ack tier's watermarks.
consistency-hosted = ["consistency", "groupnet-consistency/hosted"]
# Snapshot handoff on top of the Hosted write path: a recovering host pulls a
# covering snapshot from a donor over the data plane instead of waiting for a
# ring it has already overrun.
consistency-handoff = ["consistency-hosted", "bulk", "groupnet-consistency/handoff"]
# Resumable source-backed replay and native-position read floors, including the
# adapter-selected snapshot and event-complete subscription modes.
consistency-replication = ["consistency", "groupnet-consistency/replication"]
consistency-volatile-recovery = ["consistency", "groupnet-consistency/volatile-recovery"]
consistency-volatile-bootstrap-bulk = [
    "consistency-volatile-recovery",
    "bulk",
    "groupnet-consistency/volatile-bootstrap-bulk",
]
sim = ["dep:groupnet-sim"]

[dependencies]
groupnet-core = { workspace = true }
groupnet-transport = { workspace = true }
groupnet-transport-mem = { workspace = true, optional = true }
groupnet-transport-udp = { workspace = true, optional = true }
groupnet-transport-tcp = { workspace = true, optional = true }
groupnet-network = { workspace = true, optional = true }
groupnet-messaging = { workspace = true, optional = true }
groupnet-streams = { workspace = true, optional = true }
groupnet-transport-ipc = { workspace = true, optional = true }
groupnet-transport-punch = { workspace = true, optional = true }
groupnet-runtime = { workspace = true, optional = true }
groupnet-rpc = { workspace = true, optional = true }
groupnet-consistency = { workspace = true, optional = true }
groupnet-sim = { workspace = true, optional = true }

# The async examples drive the runtime, so they need a Tokio executor.
[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
tokio-util = { workspace = true, features = ["compat"] }
rcgen = { workspace = true }
# TLS-over-TCP baseline of the tunnel-throughput example; dev-only.
rustls = { workspace = true }
tokio-rustls = { workspace = true }
futures-util = { workspace = true, features = ["io"] }
# Path-only and publish = false: cargo strips path-only dev-deps at publish,
# so this never enters the published dependency graph. Do NOT add `version`.
groupnet-testkit = { path = "../groupnet-testkit", features = ["cluster"] }

# `placement` is sans-IO and builds from the core alone; the async examples
# drive the runtime over the in-memory transport, so they are gated off under
# `--no-default-features` builds.
[[example]]
name = "cluster"
required-features = ["runtime", "mem"]

[[example]]
name = "routing"
required-features = ["runtime", "mem"]

[[example]]
name = "dynamic-admission"
required-features = ["runtime", "tcp"]

[[example]]
name = "dynamic-relay"
required-features = ["runtime", "udp", "connectivity"]

[[example]]
name = "native-traversal"
required-features = ["runtime", "udp", "tcp", "connectivity"]

[[example]]
name = "connectivity-bridge"
required-features = ["runtime", "mem", "tcp", "connectivity"]

[[example]]
name = "application-messages"
required-features = ["runtime", "mem", "tcp", "connectivity"]

[[example]]
name = "packet-path"
required-features = ["runtime", "mem", "udp", "tcp", "connectivity"]

[[example]]
name = "tunnel-throughput"
required-features = ["runtime", "tcp"]

[lints]
workspace = true

# The doc table and its links cover every layer, so render docs.rs with all
# features on; `docsrs` turns on per-item feature badges.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
