[package]
name = "groupnet-consistency"
description = "Session-consistency primitives over Groupnet: per-writer sequenced write feeds with loss detection, and applied-write frontiers for read-your-writes barriers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The strong-coherence tier (AckLedger / applied_cluster_wide): write-side
# acknowledgement waiting. Opt-in because it has a real runtime cost — one
# ledger republish per applied event, and writers waiting on every alive
# member — which is right for small clusters and wrong for large ones (see
# the README's scaling envelope). Off by default; the session tier is free.
acks = ["tokio/time"]

# The coherence-lease tier (T3): readers hold self-expiring leases to *serve*,
# and a writer's invalidation ends at an acknowledgement or at a silent peer's
# lease lapse. Built on the ack tier's applied watermarks — the fast path is a
# T2 ack round — so it implies `acks`.
#
# Off by default, and priced honestly (the tier's honesty box has the full
# accounting). The cheap half is one 16-byte renewal entry per reader per
# renewal interval. The expensive half is the grant map: every member rewrites
# its *whole* O(roster) `~lease:g` entry on every peer renewal it adopts — up to
# N-1 rewrites of an O(N) value per member per interval — and the view task
# re-folds every granter's map on every `NodeStateChanged` it sees, including
# the ack tier's watermark churn, so that fold scales with write rate rather
# than with lease rate. Small clusters, like the ack tier it sits on.
#
# `tokio/rt` is the one thing this tier adds beyond the ack tier's toolbox: the
# lease shell owns three background tasks (renew, grant, ingest), so it spawns
# where every other tier here only borrows the caller's task.
leases = ["acks", "tokio/rt"]

# The Hosted write path (M4): fenced, epoch-scoped writes through the group's
# elected host, with a commit level pricing the guarantee (`Local` /
# `QuorumApplied` / `AllApplied`).
#
# Deliberately does *not* imply `acks`. The tier's commit ledger is a new,
# epoch-stamped entry (`~hosted:applied`) rather than a scoped reuse of the ack
# tier's `~applied`: an unstamped watermark cannot tell a fresh reading from a
# pre-migration one, which is what a leader-completeness recovery needs, and it
# lets an ack round opened before a migration resolve after the new host has
# already recovered. See the M4 as-built subsection of
# `docs/consistency-modes.md`.
#
# `tokio/time` is the whole cost: the shells poll gossip on a deadline, exactly
# as the ack tier does. Off by default — a majority round-trip per write is
# right for single-digit rosters and wrong past that.
hosted = ["tokio/time"]

# Snapshot handoff (M6): the covering state transfer the Hosted tier's recovery
# deliberately left out. A recovering host whose target lies past the end of a
# writer's gossiped ring has, without this, only `Gap` plus the consumer's own
# remediation — which is the whole story when that remediation rebuilds from the
# consumer's store, and nothing at all when the consumer's state *is* the
# groupnet-carried state. This feature pulls a covering snapshot from a donor
# over the existing data plane and verifies it at three points.
#
# It implies `hosted` (the watermarks it verifies against are the commit
# ledger's) and turns on the data plane: `groupnet-transport/bulk` plus the two
# deps that feature already carries — `bytes` for the copy-free chunk payloads
# and `futures-util` for the runtime-agnostic AsyncRead/AsyncWrite the stream
# driver is written over. Nothing novel enters the published graph: every one of
# them is already there behind `bulk`.
handoff = [
    "hosted",
    "dep:groupnet-transport",
    "groupnet-transport/bulk",
    "dep:bytes",
    "dep:futures-util",
]

# Built on the runtime's Group handle; the protocol work stays in the engine.
# tokio is only the sync toolbox (watch channels) — no executor requirement
# beyond what the runtime already has.
[dependencies]
groupnet-core = { workspace = true }
groupnet-runtime = { workspace = true }
tokio = { version = "1", default-features = false, features = ["sync"] }
# The handoff tier's data plane — inert unless the `handoff` feature is enabled,
# and the same versions `groupnet-transport/bulk` already pins.
groupnet-transport = { workspace = true, optional = true }
bytes = { version = "1", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["io"], optional = true }

# The integration tests and the doc example run real multi-node clusters over
# the in-memory transport.
[dev-dependencies]
# `bulk` unconditionally: the handoff suite drives the protocol over the
# in-process *data* plane (`MemBulkNet`), and a feature list cannot be made
# conditional on `handoff` for a dev-dependency. Dev-only, so neither the extra
# tokio slice nor the compat shim reaches the published graph.
groupnet-transport-mem = { workspace = true, features = ["bulk"] }
tokio = { workspace = true }
# The deterministic simulator, for the lease tier's DST (slice S3): the sans-IO
# cores are driven in virtual time, with no runtime and no transport. Dev-only,
# so it never enters the published dependency graph.
groupnet-sim = { workspace = true }
# Path-only and publish = false: cargo strips path-only dev-deps at publish,
# so this never enters the published dependency graph. Do NOT add `version`.
groupnet-testkit = { path = "../groupnet-testkit", features = ["cluster"] }

# The Hosted tier's examples need the tier: without this, `cargo build
# --examples` on default features would try to compile them against an absent
# `hosted` module. Declared here only — every other example stays
# auto-discovered.
[[example]]
name = "fenced_ownership"
required-features = ["hosted"]

# The External activation's example — same docres shape, epoch closed at a CAS
# object instead of by a voter majority.
[[example]]
name = "anchored_ownership"
required-features = ["hosted"]

# The handoff tier's example — the only one that needs both planes, so it also
# needs the `bulk` half of the dev-dependency above.
[[example]]
name = "hosted_handoff"
required-features = ["handoff"]

[lints]
workspace = true
