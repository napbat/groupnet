[package]
name = "groupnet-transport-ipc"
description = "Persistent native local IPC and router link providers for Groupnet."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bytes.workspace = true
zerocopy = { workspace = true, features = ["derive"] }
groupnet-core.workspace = true
groupnet-transport = { workspace = true, features = ["link", "framing"] }
tokio = { workspace = true, features = ["net", "io-util", "rt", "sync", "time", "macros"] }
tokio-util = { workspace = true, features = ["rt"] }

[dev-dependencies]
groupnet-network.workspace = true
ring.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
groupnet-testkit = { path = "../groupnet-testkit", features = ["cluster"] }

[lints]
workspace = true
