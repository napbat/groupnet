[package]
name = "groupnet-transport"
description = "Groupnet transport traits: the dep-free control-plane Transport, and an opt-in data-plane BulkTransport (feature `bulk`)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Default is the control-plane trait only — dependency-free (just groupnet-core).
# `bulk` adds the data-plane stream trait + framing and pulls its deps.
bulk = ["dep:bytes", "dep:futures-util", "dep:zerocopy"]

[dependencies]
groupnet-core = { workspace = true }
# Data-plane only — inert unless the `bulk` feature is enabled.
bytes = { workspace = true, optional = true }
futures-util = { workspace = true, features = ["io"], optional = true }
zerocopy = { workspace = true, features = ["derive"], optional = true }

[dev-dependencies]
futures = { workspace = true, features = ["executor"] }

[lints]
workspace = true
