[package]
name = "groupnet-runtime"
description = "Async, group-per-task driver for Groupnet: turns the sans-IO core into an ergonomic Node/Group API over a bound Transport."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The default runtime depends only on the transport trait. The opt-in `router`
# initialization path owns typed adapter configuration and network lifecycle.
[dependencies]
groupnet-core = { workspace = true }
groupnet-transport = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
groupnet-transport-router = { workspace = true, optional = true }

[features]
# The operating system resolver for named seeds (`SystemResolver`): Tokio's
# `net` slice for `lookup_host`. Named seeds themselves need no feature — a
# deployment with its own `SeedResolver` keeps the runtime socket-free.
dns = ["tokio/net"]
# Initialize and own heterogeneous connections through Node::network.
router = ["dep:groupnet-transport-router", "groupnet-transport/bulk"]

# Concrete transports are pulled in only to exercise the tests.
[dev-dependencies]
groupnet-transport-mem = { workspace = true }
groupnet-transport-udp = { workspace = true }
# The named-seed resolver's unit tests drive its schedule on a paused clock.
tokio = { workspace = true, features = ["test-util"] }
# Path-only and publish = false: cargo strips path-only dev-deps at publish,
# so this never enters the published dependency graph. Do NOT add `version`.
groupnet-testkit = { path = "../groupnet-testkit", features = ["cluster"] }

[lints]
workspace = true
