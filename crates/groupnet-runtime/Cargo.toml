[package]
name = "groupnet-runtime"
description = "Async, group-per-task driver for Groupnet: turns the sans-IO core into an ergonomic Node/Group API over a bound Transport."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Transport-agnostic: this crate depends only on the trait, never on a concrete
# binding. It's the only layer that needs an async runtime, so it's the only
# crate here that pulls in tokio — and only a narrow slice of it.
[dependencies]
groupnet-core = { workspace = true }
groupnet-transport = { workspace = true }
tokio = { workspace = true }

# Concrete transports are pulled in only to exercise the tests.
[dev-dependencies]
groupnet-transport-mem = { workspace = true }
groupnet-transport-udp = { workspace = true }

[lints]
workspace = true
